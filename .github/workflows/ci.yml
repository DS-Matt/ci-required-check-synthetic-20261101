name: Required check reproduction
on:
  push:
    branches: [reproduce]
  pull_request:
    types: [opened, synchronize, ready_for_review, edited]
concurrency:
  group: repro-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base == null && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}
jobs:
  tests:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - run: echo synthetic-tests-passed
  ci:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'ci (metadata-only)' || 'ci' }}
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    env:
      METADATA_ONLY: ${{ github.event.action == 'edited' && github.event.changes.base == null }}
      TEST_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Report actual test result only for real CI events
        run: |
          if [ "$METADATA_ONLY" = true ]; then
            echo 'Metadata update; no test result asserted.'
          else
            test "$TEST_RESULT" = success
          fi
